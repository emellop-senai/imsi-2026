name: imsi-2026

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senai}
      POSTGRES_DB: ${POSTGRES_DB:-quitanda}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - imsi-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      target: backend-runtime
    image: imsi-backend:1.0
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:-senai}
      DB_HOST: database
      DB_NAME: ${POSTGRES_DB:-quitanda}
      DB_PORT: 5432
    ports:
      - "3000:3000"
    networks:
      - imsi-network
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend-runtime
    image: imsi-frontend:1.0
    ports:
      - "8080:8080"
    networks:
      - imsi-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
    name: imsi-postgres-data

networks:
  imsi-network:
    name: imsi-network
